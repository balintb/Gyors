[workspace]
resolver = "2"
members = [
    "crates/gyors-core",
    "crates/gyors-index",
    "crates/gyors-plugin-host",
    "crates/gyors-providers",
    "crates/gyors-ipc",
    "crates/gyors-cli",
    "crates/gyors-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Balint Bartfai"]
license = "MIT"
repository = "https://github.com/balintb/Gyors"
homepage = "https://gyo.rs"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
arc-swap = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
chrono-tz = "0.10"
csv = "1"
dirs = "6"
emojis = "0.8"
fend-core = "1"
futures = "0.3"
heck = "0.5"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
md5 = "0.7"
notify = "8"
qrcode = { version = "0.14", default-features = false }
nucleo = "0.5"
plist = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
strsim = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-util",
] }
toml = "0.8"
tracing = { version = "0.1", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1
